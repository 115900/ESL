<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GD Layout & Easy Demonlist</title>
  <style>
    :root {
      --bg-color: #0d0f12;
      --card-bg: #161920;
      --accent: #2196f3;
      --text: #ffffff;
      --text-dim: #9ea8b6;
      --border: #2a2e39;
    }

    [data-theme="light"] {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --accent: #0066cc;
      --text: #1a1a1a;
      --text-dim: #666666;
      --border: #e0e0e0;
    }

    [data-theme="cyberpunk"] {
      --bg-color: #0f051d;
      --card-bg: #1d0c36;
      --accent: #ff007f;
      --text: #00f6ff;
      --text-dim: #b57edc;
      --border: #ff007f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background-color: var(--bg-color); color: var(--text); padding-bottom: 40px; }
    
    /* Header & Navigation Bar */
    header { background: var(--card-bg); padding: 15px 20px; border-bottom: 3px solid var(--accent); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .brand h1 { font-size: 1.5rem; color: var(--accent); }
    .brand p { font-size: 0.8rem; color: var(--text-dim); }

    .nav-group { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    
    button, select { background: var(--accent); color: #fff; border: none; padding: 8px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
    button:hover { opacity: 0.85; }
    .btn-outline { background: transparent; border: 1px solid var(--accent); color: var(--text); }
    .btn-admin { background: #e91e63; }
    
    .container { max-width: 900px; margin: 25px auto; padding: 0 15px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Cards */
    .card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; padding: 15px 20px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .rank { font-size: 1.3rem; font-weight: bold; color: var(--accent); width: 40px; }
    .details h3 { margin-bottom: 4px; font-size: 1rem; }
    .details p { font-size: 0.85rem; color: var(--text-dim); }
    .points { font-weight: bold; color: var(--accent); }

    /* Admin Panel Form */
    .panel { background: var(--card-bg); border: 1px solid var(--border); padding: 20px; border-radius: 6px; margin-bottom: 20px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; margin-bottom: 4px; font-size: 0.85rem; color: var(--text-dim); }
    .form-group input, .form-group select { width: 100%; padding: 8px; background: var(--bg-color); border: 1px solid var(--border); color: var(--text); border-radius: 4px; }

    /* Modals */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000; }
    .modal.active { display: flex; }
    .modal-content { background: var(--card-bg); padding: 25px; border-radius: 6px; width: 100%; max-width: 350px; border: 1px solid var(--border); }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1 id="site-title">Layout & Easy Demonlist</h1>
      <p id="site-subtitle">Official rankings and player stats</p>
    </div>

    <div class="nav-group">
      <!-- Navigation Tabs -->
      <button onclick="switchTab('list')">Demon List</button>
      <button class="btn-outline" onclick="switchTab('stats')">Player Stats</button>
      <button id="admin-tab-btn" class="btn-admin" onclick="switchTab('admin')">Admin Panel</button>
      
      <!-- Theme Switcher -->
      <select id="theme-select" onchange="changeTheme(this.value)">
        <option value="dark">Dark Theme</option>
        <option value="light">Light Theme</option>
        <option value="cyberpunk">Cyberpunk</option>
      </select>

      <!-- Auth State Controls -->
      <div id="auth-buttons" style="display:none;">
        <button class="btn-outline" onclick="openAuthModal('login')">Log In</button>
        <button onclick="openAuthModal('signup')">Sign Up</button>
      </div>
      <div id="user-info">
        <span id="user-display" style="font-size: 0.85rem; font-weight: bold;"></span>
        <button class="btn-outline" onclick="logout()">Logout</button>
      </div>
    </div>
  </header>

  <div class="container">

    <!-- DEMON LIST TAB -->
    <section id="tab-list" class="tab-content active">
      <h2 style="margin-bottom: 15px;">Demon Rankings</h2>
      <div id="levels-container"></div>
    </section>

    <!-- PLAYER STATS TAB -->
    <section id="tab-stats" class="tab-content">
      <h2 style="margin-bottom: 15px;">Player Stats Tracker</h2>
      <div class="panel">
        <div class="form-group">
          <label>Select Registered Player:</label>
          <select id="player-select" onchange="renderPlayerStats()"></select>
        </div>
      </div>
      <div id="player-profile"></div>
    </section>

    <!-- ADMIN PANEL TAB -->
    <section id="tab-admin" class="tab-content">
      <h2>Admin Control Panel</h2>
      <p style="color: var(--text-dim); margin-bottom: 15px; font-size: 0.9rem;">Manage list entries, customization, and user permissions.</p>
      
      <div class="panel">
        <h3>Add New Level to List</h3>
        <form onsubmit="handleAddLevel(event)">
          <div class="form-group"><label>Level Name</label><input type="text" id="nl-name" required></div>
          <div class="form-group"><label>Creator</label><input type="text" id="nl-creator" required></div>
          <div class="form-group"><label>Verifier</label><input type="text" id="nl-verifier" required></div>
          <div class="form-group"><label>Level ID</label><input type="text" id="nl-id" required></div>
          <div class="form-group"><label>Points Value</label><input type="number" id="nl-points" required></div>
          <button type="submit">Add Level</button>
        </form>
      </div>

      <div class="panel">
        <h3>Site Title Customization</h3>
        <form onsubmit="handleSiteSettings(event)">
          <div class="form-group"><label>Custom Site Name</label><input type="text" id="set-title"></div>
          <div class="form-group"><label>Custom Subtitle</label><input type="text" id="set-subtitle"></div>
          <button type="submit">Update Title</button>
        </form>
      </div>

      <div class="panel">
        <h3>User Role Management</h3>
        <div class="form-group">
          <label>Promote User to Admin:</label>
          <select id="admin-user-select"></select>
        </div>
        <button class="btn-admin" onclick="makeUserAdmin()">Promote Selected User</button>
      </div>
    </section>

  </div>

  <!-- LOGIN / SIGNUP MODAL -->
  <div id="auth-modal" class="modal">
    <div class="modal-content">
      <h3 id="modal-title" style="margin-bottom: 15px;">Login</h3>
      <form onsubmit="handleAuth(event)">
        <div class="form-group"><label>Username</label><input type="text" id="auth-username" required></div>
        <div class="form-group"><label>Password</label><input type="password" id="auth-password" required></div>
        <button type="submit" style="width: 100%;">Submit</button>
      </form>
      <button class="btn-outline" style="width: 100%; margin-top: 8px;" onclick="closeAuthModal()">Close</button>
    </div>
  </div>

  <script>
    const defaultData = {
      settings: { title: "Layout & Easy Demonlist", subtitle: "Official rankings and player stats" },
      users: [
        { username: "admin", password: "123", role: "admin", completed: ["Cataclysm Layout", "Problematic"] },
        { username: "Player1", password: "123", role: "user", completed: ["Problematic", "The Nightmare"] }
      ],
      levels: [
        { rank: 1, name: "Cataclysm Layout", creator: "Viprin", verifier: "Riot", points: 100, id: "11111111" },
        { rank: 2, name: "Problematic", creator: "Darnoc", verifier: "Darnoc", points: 90, id: "10163300" },
        { rank: 3, name: "The Nightmare", creator: "Jax", verifier: "Jax", points: 80, id: "13519" }
      ]
    };

    let state = JSON.parse(localStorage.getItem('gd_list_data')) || defaultData;
    // Default automatically logs in as 'admin' so all features are visible right away
    let currentUser = JSON.parse(localStorage.getItem('gd_list_session')) || state.users[0];
    let authMode = 'login';

    function saveData() {
      localStorage.setItem('gd_list_data', JSON.stringify(state));
    }

    function init() {
      document.getElementById('site-title').innerText = state.settings.title;
      document.getElementById('site-subtitle').innerText = state.settings.subtitle;
      renderLevels();
      updateAuthUI();
      populateDropdowns();
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.getElementById(`tab-${tab}`).classList.add('active');
      if(tab === 'stats') renderPlayerStats();
    }

    function changeTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
    }

    function renderLevels() {
      document.getElementById('levels-container').innerHTML = state.levels.map(level => `
        <div class="card">
          <div style="display:flex; align-items:center;">
            <span class="rank">#${level.rank}</span>
            <div class="details">
              <h3>${level.name}</h3>
              <p>By ${level.creator} | Verifier: ${level.verifier}</p>
            </div>
          </div>
          <div style="text-align:right;">
            <div class="points">${level.points} Pts</div>
            <div class="details"><p>ID: ${level.id}</p></div>
          </div>
        </div>
      `).join('');
    }

    function updateAuthUI() {
      if(currentUser) {
        document.getElementById('auth-buttons').style.display = 'none';
        document.getElementById('user-info').style.display = 'flex';
        document.getElementById('user-info').style.gap = '8px';
        document.getElementById('user-info').style.alignItems = 'center';
        document.getElementById('user-display').innerText = `${currentUser.username} (${currentUser.role})`;
        document.getElementById('admin-tab-btn').style.display = currentUser.role === 'admin' ? 'inline-block' : 'none';
      } else {
        document.getElementById('auth-buttons').style.display = 'flex';
        document.getElementById('auth-buttons').style.gap = '8px';
        document.getElementById('user-info').style.display = 'none';
        document.getElementById('admin-tab-btn').style.display = 'none';
      }
    }

    function openAuthModal(mode) {
      authMode = mode;
      document.getElementById('modal-title').innerText = mode === 'login' ? 'Login' : 'Sign Up';
      document.getElementById('auth-modal').classList.add('active');
    }

    function closeAuthModal() {
      document.getElementById('auth-modal').classList.remove('active');
    }

    function handleAuth(e) {
      e.preventDefault();
      const u = document.getElementById('auth-username').value;
      const p = document.getElementById('auth-password').value;

      if(authMode === 'signup') {
        if(state.users.find(x => x.username === u)) return alert('Username already exists!');
        const newUser = { username: u, password: p, role: 'user', completed: [] };
        state.users.push(newUser);
        currentUser = newUser;
      } else {
        const user = state.users.find(x => x.username === u && x.password === p);
        if(!user) return alert('Invalid credentials!');
        currentUser = user;
      }

      saveData();
      localStorage.setItem('gd_list_session', JSON.stringify(currentUser));
      closeAuthModal();
      updateAuthUI();
      populateDropdowns();
    }

    function logout() {
      currentUser = null;
      localStorage.removeItem('gd_list_session');
      updateAuthUI();
      switchTab('list');
    }

    function populateDropdowns() {
      const options = state.users.map(u => `<option value="${u.username}">${u.username}</option>`).join('');
      document.getElementById('player-select').innerHTML = options;
      document.getElementById('admin-user-select').innerHTML = options;
    }

    function renderPlayerStats() {
      const username = document.getElementById('player-select').value;
      const user = state.users.find(u => u.username === username);
      if(!user) return;

      let score = 0;
      user.completed.forEach(lvlName => {
        const match = state.levels.find(l => l.name === lvlName);
        if(match) score += match.points;
      });

      document.getElementById('player-profile').innerHTML = `
        <div class="card">
          <div>
            <h3>${user.username}</h3>
            <p class="details">Completed: ${user.completed.join(', ') || 'No records'}</p>
          </div>
          <div class="points">${score} Points</div>
        </div>
      `;
    }

    function handleAddLevel(e) {
      e.preventDefault();
      state.levels.push({
        rank: state.levels.length + 1,
        name: document.getElementById('nl-name').value,
        creator: document.getElementById('nl-creator').value,
        verifier: document.getElementById('nl-verifier').value,
        id: document.getElementById('nl-id').value,
        points: parseInt(document.getElementById('nl-points').value)
      });
      saveData();
      renderLevels();
      alert('Level added!');
    }

    function handleSiteSettings(e) {
      e.preventDefault();
      const t = document.getElementById('set-title').value;
      const s = document.getElementById('set-subtitle').value;
      if(t) state.settings.title = t;
      if(s) state.settings.subtitle = s;
      saveData();
      init();
      alert('Site title updated!');
    }

    function makeUserAdmin() {
      const u = document.getElementById('admin-user-select').value;
      const user = state.users.find(x => x.username === u);
      if(user) {
        user.role = 'admin';
        saveData();
        alert(`${u} upgraded to admin!`);
      }
    }

    init();
  </script>
</body>
</html>
