<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout & Easy Demonlist</title>
  <style>
    :root {
      --bg-color: #0d0f12;
      --card-bg: #161920;
      --accent: #2196f3;
      --text: #ffffff;
      --text-dim: #9ea8b6;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 0;
    }

    header {
      background: #111318;
      padding: 20px;
      text-align: center;
      border-bottom: 3px solid var(--accent);
    }

    header h1 {
      margin: 0;
      font-size: 2rem;
      letter-spacing: 1px;
    }

    header p {
      margin: 5px 0 0;
      color: var(--text-dim);
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .level-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .level-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .level-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .rank {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--accent);
      width: 45px;
    }

    .details h3 {
      margin: 0 0 5px 0;
    }

    .details p {
      margin: 0;
      font-size: 0.9rem;
      color: var(--text-dim);
    }

    .meta {
      text-align: right;
    }

    .points {
      font-size: 1.1rem;
      font-weight: bold;
    }

    .level-id {
      font-size: 0.8rem;
      color: var(--text-dim);
    }
  </style>
</head>
<body>

  <header>
    <h1>Layout & Easy Demonlist</h1>
    <p>Official rankings for Layouts and Easy Demons</p>
  </header>

  <div class="container">
    <div class="level-list">

      <div class="level-card">
        <div class="level-info">
          <span class="rank">#1</span>
          <div class="details">
            <h3>Cataclysm Layout</h3>
            <p>By Viprin | Verified by Riot</p>
          </div>
        </div>
        <div class="meta">
          <div class="points">100 Pts</div>
          <div class="level-id">ID: 11111111</div>
        </div>
      </div>

      <div class="level-card">
        <div class="level-info">
          <span class="rank">#2</span>
          <div class="details">
            <h3>Problematic</h3>
            <p>By Darnoc | Verified by Darnoc</p>
          </div>
        </div>
        <div class="meta">
          <div class="points">90 Pts</div>
          <div class="level-id">ID: 10163300</div>
        </div>
      </div>

      <div class="level-card">
        <div class="level-info">
          <span class="rank">#3</span>
          <div class="details">
            <h3>The Nightmare</h3>
            <p>By Jax | Verified by Jax</p>
          </div>
        </div>
        <div class="meta">
          <div class="points">80 Pts</div>
          <div class="level-id">ID: 13519</div>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
